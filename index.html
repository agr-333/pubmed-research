<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PubMed Research Trends</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .bar { transition: width 0.6s ease; }
  .spinner { display:inline-block;width:36px;height:36px;border:4px solid #e5e7eb;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .hidden { display:none; }
</style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
<div class="max-w-5xl mx-auto space-y-4">

  <!-- Header -->
  <div class="bg-white rounded-xl shadow p-6">
    <h1 class="text-3xl font-bold text-gray-900">PubMed Research Trends</h1>
    <p class="text-gray-500 text-sm mt-1">Search scientific literature · Analyze trends · Measure impact</p>
  </div>

  <!-- Search -->
  <div class="bg-white rounded-xl shadow p-6">
    <div class="flex gap-3 mb-3 flex-wrap">
      <input id="query" type="text" placeholder="Search by topic, disease, treatment..."
        class="flex-1 min-w-[200px] border-2 border-gray-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
        onkeydown="if(event.key==='Enter') doSearch()"/>
      <button onclick="doSearch()" class="bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 font-medium">Search</button>
      <button onclick="doTrends()" class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 font-medium">📈 Trends</button>
      <button onclick="doImpact()" class="bg-purple-600 text-white px-6 py-3 rounded-lg hover:bg-purple-700 font-medium">⭐ Impact</button>
    </div>
    <button onclick="toggleFilters()" class="text-sm text-gray-600 hover:text-gray-900">⚙ Filters <span id="fa">▼</span></button>
    <div id="filterBox" class="hidden grid grid-cols-2 md:grid-cols-4 gap-3 mt-3 pt-3 border-t">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">From year</label>
        <input id="yearFrom" type="number" placeholder="2020" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">To year</label>
        <input id="yearTo" type="number" placeholder="2024" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Article Type</label>
        <select id="artType" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="">All</option>
          <option value="Clinical Trial[pt]">Clinical Trial</option>
          <option value="Meta-Analysis[pt]">Meta-Analysis</option>
          <option value="Review[pt]">Review</option>
          <option value="Systematic Review[pt]">Systematic Review</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Language</label>
        <select id="lang" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="">All</option>
          <option value="english[lang]">English</option>
          <option value="spanish[lang]">Spanish</option>
          <option value="french[lang]">French</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Error -->
  <div id="errBox" class="hidden bg-red-50 border border-red-200 rounded-lg p-4 text-red-800 text-sm"></div>

  <!-- Loading -->
  <div id="loadBox" class="hidden bg-white rounded-xl shadow p-10 text-center">
    <div class="spinner mx-auto mb-3"></div>
    <p id="loadMsg" class="text-gray-500 text-sm">Loading…</p>
  </div>

  <!-- Tabs -->
  <div id="tabArea" class="hidden bg-white rounded-xl shadow overflow-hidden">
    <div class="flex border-b">
      <button id="tab-search" onclick="showTab('search')" class="px-5 py-3 font-medium text-sm border-b-2 border-blue-600 text-blue-600">Search</button>
      <button id="tab-trends" onclick="showTab('trends')" class="px-5 py-3 font-medium text-sm text-gray-500 hover:text-gray-800">Trends</button>
      <button id="tab-impact" onclick="showTab('impact')" class="px-5 py-3 font-medium text-sm text-gray-500 hover:text-gray-800">Impact</button>
    </div>
    <div id="pane-search" class="p-6"></div>
    <div id="pane-trends" class="p-6 hidden"></div>
    <div id="pane-impact" class="p-6 hidden"></div>
  </div>

</div>
<script>
/* ── State ── */
let allArticles = [], selectedPmids = [], filtersOpen = false;

/* ── UI helpers ── */
function showErr(m) { const b=document.getElementById('errBox'); b.textContent=m; b.classList.remove('hidden'); }
function hideErr()  { document.getElementById('errBox').classList.add('hidden'); }
function showLoad(m){ document.getElementById('loadMsg').textContent=m||'Loading…'; document.getElementById('loadBox').classList.remove('hidden'); }
function hideLoad() { document.getElementById('loadBox').classList.add('hidden'); }
function toggleFilters() {
  filtersOpen=!filtersOpen;
  document.getElementById('filterBox').classList.toggle('hidden',!filtersOpen);
  document.getElementById('fa').textContent=filtersOpen?'▲':'▼';
}
function showTab(name) {
  ['search','trends','impact'].forEach(t=>{
    document.getElementById('pane-'+t).classList.toggle('hidden',t!==name);
    const b=document.getElementById('tab-'+t);
    b.className=t===name?'px-5 py-3 font-medium text-sm border-b-2 border-blue-600 text-blue-600':'px-5 py-3 font-medium text-sm text-gray-500 hover:text-gray-800';
  });
}
const sleep = ms => new Promise(res => setTimeout(res, ms));

/* ── PubMed E-utilities ── */
const EBASE = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils';

function buildQuery() {
  const q   = document.getElementById('query').value.trim();
  const yf  = document.getElementById('yearFrom').value;
  const yt  = document.getElementById('yearTo').value;
  const at  = document.getElementById('artType').value;
  const ln  = document.getElementById('lang').value;
  let parts = [q];
  if (yf || yt) parts.push(`("${yf||'1900'}"[PDAT]:"${yt||'3000'}"[PDAT])`);
  if (at) parts.push(at);
  if (ln) parts.push(ln);
  return parts.join(' AND ');
}

async function fetchPmids(term, retmax=20) {
  const url = `${EBASE}/esearch.fcgi?db=pubmed&term=${encodeURIComponent(term)}&retmax=${retmax}&retmode=json`;
  const r = await fetch(url);
  const d = await r.json();
  return { ids: d.esearchresult.idlist, count: parseInt(d.esearchresult.count||0) };
}

async function fetchSummaries(ids) {
  if (!ids.length) return [];
  const url = `${EBASE}/esummary.fcgi?db=pubmed&id=${ids.join(',')}&retmode=json`;
  const r = await fetch(url);
  const d = await r.json();
  return ids.map(id => {
    const s = d.result[id] || {};
    const authors = (s.authors||[]).map(a=>a.name).join(', ');
    const journal = s.source || '';
    const year    = (s.pubdate||'').slice(0,4);
    const doi     = (s.articleids||[]).find(x=>x.idtype==='doi')?.value || '';
    const types   = (s.pubtype||[]).join(', ') || 'Article';
    return { pmid:id, title:s.title||'', authors, journal, year, doi, type:types, abstract:'' };
  });
}

async function fetchAbstracts(ids) {
  if (!ids.length) return {};
  const url = `${EBASE}/efetch.fcgi?db=pubmed&id=${ids.join(',')}&rettype=abstract&retmode=xml`;
  const r   = await fetch(url);
  const txt = await r.text();
  const parser = new DOMParser();
  const xml    = parser.parseFromString(txt,'text/xml');
  const out    = {};
  xml.querySelectorAll('PubmedArticle').forEach(art=>{
    const pmid = art.querySelector('PMID')?.textContent;
    const abs  = art.querySelector('AbstractText')?.textContent || '';
    if (pmid) out[pmid] = abs;
  });
  return out;
}

/* ── Search ── */
async function doSearch() {
  const q = document.getElementById('query').value.trim();
  if (!q) { showErr('Please enter a search term'); return; }
  hideErr(); showLoad('Searching PubMed…');
  document.getElementById('tabArea').classList.add('hidden');
  try {
    const term = buildQuery();
    const { ids, count } = await fetchPmids(term, 20);
    if (!ids.length) { showErr('No results found. Try different search terms.'); hideLoad(); return; }
    const articles = await fetchSummaries(ids);
    const abstracts = await fetchAbstracts(ids);
    articles.forEach(a => { a.abstract = abstracts[a.pmid] || ''; });
    allArticles = articles; selectedPmids = [];
    renderArticles(articles, count);
    document.getElementById('tabArea').classList.remove('hidden');
    showTab('search');
  } catch(e) { showErr('Search failed: ' + e.message); }
  hideLoad();
}

function renderArticles(articles, total) {
  const pane = document.getElementById('pane-search');
  pane.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <h2 class="font-semibold text-gray-900">Results (${articles.length} of ${(total||articles.length).toLocaleString()} total)</h2>
      <button onclick="openExport()" id="exportBtn" class="hidden bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Export selected</button>
    </div>
    <div class="space-y-3" id="articleList"></div>`;
  const list = document.getElementById('articleList');
  articles.forEach((a,idx) => {
    const div = document.createElement('div');
    div.className='border rounded-lg p-4 cursor-pointer transition border-gray-200 hover:border-gray-300';
    div.id='art-'+idx;
    div.innerHTML=`
      <div class="flex justify-between mb-2">
        <div class="flex-1">
          <span class="text-xs font-semibold text-blue-600">PMID: ${a.pmid}</span>
          <h3 class="font-medium text-gray-900 mt-0.5">${a.title}</h3>
        </div>
        <input type="checkbox" class="h-5 w-5 mt-1 ml-3" id="chk-${idx}"/>
      </div>
      <div class="grid grid-cols-2 gap-1 text-xs text-gray-600">
        <div><b>Authors:</b> ${a.authors||'N/A'}</div>
        <div><b>Year:</b> ${a.year||'N/A'}</div>
        <div><b>Journal:</b> ${a.journal||'N/A'}</div>
        <div><b>Type:</b> ${a.type||'N/A'}</div>
      </div>
      ${a.abstract?`<p class="mt-2 text-xs text-gray-500 border-t pt-2">${a.abstract.slice(0,240)}…</p>`:''}`;
    div.onclick=()=>toggleSelect(idx,a.pmid);
    list.appendChild(div);
  });
}

function toggleSelect(idx,pmid) {
  const chk=document.getElementById('chk-'+idx);
  const div=document.getElementById('art-'+idx);
  if (selectedPmids.includes(pmid)) {
    selectedPmids=selectedPmids.filter(p=>p!==pmid);
    chk.checked=false; div.classList.remove('border-blue-500','bg-blue-50'); div.classList.add('border-gray-200');
  } else {
    selectedPmids.push(pmid); chk.checked=true; div.classList.add('border-blue-500','bg-blue-50'); div.classList.remove('border-gray-200');
  }
  const btn=document.getElementById('exportBtn');
  if (btn) { btn.classList.toggle('hidden',!selectedPmids.length); btn.textContent=`Export ${selectedPmids.length} selected`; }
}

/* ── Trends (serialized to respect PubMed 3 req/s limit) ── */
async function doTrends() {
  const q = document.getElementById('query').value.trim();
  if (!q) { showErr('Enter a search term first'); return; }
  hideErr(); showLoad('Analyzing trends…');
  document.getElementById('tabArea').classList.remove('hidden');
  showTab('trends');
  document.getElementById('pane-trends').innerHTML='<div class="text-center py-16 text-gray-400">Analyzing…</div>';
  try {
    const currentYear = new Date().getFullYear();
    const years = Array.from({length:10},(_,i)=>currentYear-9+i);
    const counts = [];
    for (const yr of years) {
      const term = `${q} AND ("${yr}"[PDAT]:"${yr}"[PDAT])`;
      const url  = `${EBASE}/esearch.fcgi?db=pubmed&term=${encodeURIComponent(term)}&retmax=0&retmode=json`;
      const r    = await fetch(url);
      const d    = await r.json();
      counts.push({ year: yr, count: parseInt(d.esearchresult.count || 0) });
      showLoad(`Analyzing trends… ${yr}`);
      await sleep(350);
    }
    const { ids } = await fetchPmids(q, 5);
    await sleep(350);
    const top5 = await fetchSummaries(ids);
    renderTrends(counts, top5, q);
  } catch(e) { showErr('Trends failed: '+e.message); }
  hideLoad();
}

function renderTrends(counts, top5, q) {
  const max = Math.max(...counts.map(i=>i.count),1);
  const bars = counts.map(item=>`
    <div class="flex items-center gap-3">
      <div class="w-12 text-sm text-gray-600 font-medium">${item.year}</div>
      <div class="flex-1 bg-gray-200 rounded-full h-7">
        <div class="bg-blue-600 h-7 rounded-full flex items-center justify-end pr-2 bar" style="width:${Math.max((item.count/max)*100,2)}%">
          <span class="text-white text-xs font-medium">${item.count.toLocaleString()}</span>
        </div>
      </div>
    </div>`).join('');

  const total = counts.reduce((s,i)=>s+i.count,0);
  const first = counts[0]?.count || 0;
  const last  = counts[counts.length-1]?.count || 0;
  const trend = last > first ? `↑ Growing (+${Math.round((last-first)/Math.max(first,1)*100)}% over 10 years)` : `↓ Declining`;

  const recentArticles = top5.map(a=>`
    <div class="p-3 bg-gray-50 rounded-lg">
      <div class="font-medium text-gray-900 text-sm">${a.title}</div>
      <div class="text-xs text-gray-500 mt-0.5">${a.authors} · ${a.journal} · ${a.year}</div>
    </div>`).join('');

  document.getElementById('pane-trends').innerHTML=`
    <div class="space-y-6">
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
        <h3 class="font-semibold text-blue-900 mb-1">Research Overview: "${q}"</h3>
        <p class="text-blue-800 text-sm">${total.toLocaleString()} total publications in the last 10 years. ${trend}.</p>
      </div>
      <div>
        <h3 class="font-semibold text-gray-900 mb-3">📊 Publications Per Year (Real PubMed Data)</h3>
        <div class="space-y-2">${bars}</div>
      </div>
      ${recentArticles?`<div><h3 class="font-semibold text-gray-900 mb-3">📄 Most Recent Articles</h3><div class="space-y-2">${recentArticles}</div></div>`:''}
    </div>`;
}

/* ── Impact (NIH iCite, CORS-friendly, no key needed) ── */
async function doImpact() {
  const q = document.getElementById('query').value.trim();
  if (!q) { showErr('Enter a search term first'); return; }
  hideErr(); showLoad('Loading citation data from NIH iCite…');
  document.getElementById('tabArea').classList.remove('hidden');
  showTab('impact');
  document.getElementById('pane-impact').innerHTML='<div class="text-center py-16 text-gray-400">Loading…</div>';
  try {
    const { ids } = await fetchPmids(q, 10);
    if (!ids.length) { showErr('No PubMed results for this query.'); hideLoad(); return; }
    const summaries = await fetchSummaries(ids);
    const r = await fetch(`https://icite.od.nih.gov/api/pubs?pmids=${ids.join(',')}`);
    if (!r.ok) throw new Error('iCite API error ' + r.status);
    const d = await r.json();
    const merged = summaries.map(s => {
      const m = (d.data || []).find(x => String(x.pmid) === s.pmid) || {};
      return {
        ...s,
        citationCount:   m.citation_count       || 0,
        citsPerYear:     m.citations_per_year   || 0,
        rcr:             m.relative_citation_ratio,
        nihPercentile:   m.nih_percentile,
        fieldCitRate:    m.field_citation_rate,
        isClinical:      m.is_clinical,
        doi:             m.doi || s.doi
      };
    }).sort((a,b) => b.citationCount - a.citationCount);
    renderImpact(merged, q);
  } catch(e) { showErr('Impact failed: '+e.message); }
  hideLoad();
}

function renderImpact(papers, q) {
  if (!papers.length) { document.getElementById('pane-impact').innerHTML='<div class="text-center py-16 text-gray-400">No impact data found.</div>'; return; }

  const totalCites = papers.reduce((s,p)=>s+(p.citationCount||0),0);
  const avgCites   = Math.round(totalCites/papers.length);
  const withRcr    = papers.filter(p => typeof p.rcr === 'number');
  const avgRcr     = withRcr.length ? (withRcr.reduce((s,p)=>s+p.rcr,0)/withRcr.length).toFixed(2) : '—';

  const overview = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      ${[
        {l:'Papers Found',    v:papers.length},
        {l:'Total Citations', v:totalCites.toLocaleString()},
        {l:'Avg Citations',   v:avgCites},
        {l:'Avg RCR',         v:avgRcr},
      ].map(i=>`<div class="bg-gray-50 border rounded-lg p-4 text-center">
        <div class="text-2xl font-bold text-blue-600">${i.v}</div>
        <div class="text-xs text-gray-500 mt-1">${i.l}</div>
      </div>`).join('')}
    </div>
    <p class="text-xs text-gray-500 mb-4">Source: NIH iCite · RCR = Relative Citation Ratio (1.0 = median NIH-funded paper).</p>`;

  const cards = papers.map(p=>{
    const doi = p.doi || '';
    const rcr = typeof p.rcr === 'number' ? p.rcr.toFixed(2) : '—';
    const pct = typeof p.nihPercentile === 'number' ? Math.round(p.nihPercentile) + '%' : '—';
    const cpy = p.citsPerYear ? p.citsPerYear.toFixed(1) : '—';
    return `
      <div class="border-2 border-gray-100 rounded-xl p-5 mb-4">
        <div class="mb-3">
          <span class="text-xs text-blue-600 font-semibold">PMID: ${p.pmid} · </span>
          <span class="text-xs text-gray-500">${p.year||'N/A'}</span>
          ${p.isClinical?'<span class="ml-2 text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">Clinical</span>':''}
          <h4 class="font-semibold text-gray-900 mt-1">${p.title||''}</h4>
          <p class="text-xs text-gray-500 mt-0.5">${p.authors||''}</p>
          <p class="text-xs text-gray-400 mt-0.5">${p.journal||''}</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-200 rounded-lg p-4">
            <h5 class="font-semibold text-blue-900 text-sm mb-3">NIH iCite Metrics</h5>
            <div class="grid grid-cols-4 gap-2 text-center mb-3">
              ${[
                {l:'Citations',  v:(p.citationCount||0).toLocaleString()},
                {l:'Cits/Year',  v:cpy},
                {l:'RCR',        v:rcr},
                {l:'NIH %ile',   v:pct},
              ].map(m=>`<div class="bg-white rounded p-1.5">
                <div class="text-sm font-bold text-gray-800">${m.v}</div>
                <div class="text-xs text-gray-500">${m.l}</div>
              </div>`).join('')}
            </div>
            <div class="flex flex-wrap gap-3 text-xs">
              <a href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank" class="text-blue-600 hover:underline">PubMed ↗</a>
              ${doi?`<a href="https://doi.org/${doi}" target="_blank" class="text-blue-600 hover:underline">DOI: ${doi}</a>`:''}
              <a href="https://icite.od.nih.gov/analysis?pmids=${p.pmid}" target="_blank" class="text-blue-600 hover:underline">iCite report ↗</a>
            </div>
          </div>
          <div class="bg-gradient-to-br from-orange-50 to-yellow-50 border border-orange-200 rounded-lg p-4">
            <h5 class="font-semibold text-orange-900 text-sm mb-2">Altmetric</h5>
            <p class="text-xs text-gray-600 mb-3">View real-time attention data on Altmetric.com:</p>
            ${doi?`<a href="https://www.altmetric.com/details/${doi}" target="_blank"
              class="inline-block bg-orange-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-orange-600">
              View Altmetric Score ↗
            </a>`:'<span class="text-xs text-gray-400">DOI not available</span>'}
          </div>
        </div>
      </div>`;
  }).join('');

  document.getElementById('pane-impact').innerHTML = overview +
    `<h3 class="font-semibold text-gray-900 text-lg mb-4">Top Papers by Citation Count</h3>` + cards;
}

/* ── Export ── */
function openExport() {
  const sel = allArticles.filter(a=>selectedPmids.includes(a.pmid));
  const fmt = prompt('Format? APA, Vancouver, or MLA','APA')||'APA';
  const lines = sel.map(a=>{
    const auth=(a.authors||'').split(',')[0].trim()+' et al.';
    if (fmt==='APA')       return `${auth} (${a.year}). ${a.title}. ${a.journal}. ${a.doi?'https://doi.org/'+a.doi:'PMID: '+a.pmid}`;
    if (fmt==='Vancouver') return `${auth}. ${a.title}. ${a.journal}. ${a.year}. PMID: ${a.pmid}`;
    return `${auth} "${a.title}." ${a.journal} (${a.year}).`;
  });
  const blob=new Blob([lines.join('\n\n')],{type:'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='bibliography.txt'; a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
